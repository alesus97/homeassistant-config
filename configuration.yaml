####################################################
#                                                  #
#                Default Config                    #
#                                                  #
####################################################

homeassistant:
  name: Casa
  latitude: !secret homeassistant_latitude
  longitude: !secret homeassistant_longitude
  unit_system: metric
  time_zone: Europe/Rome
  country: IT
  external_url: !secret external_url
  internal_url: !secret internal_url
 # customize: !include customize.yaml
  allowlist_external_dirs: #Serve per far vedere il db dal sensore della dimensione
    - /config

my:

history: !include history.yaml
####################################################
#                                                  #
#                     LOGGER                       #
#                                                  #
####################################################

logger:
  default: critical
  logs:
    # log level for HA core
    homeassistant.core: fatal


####################################################
#                                                  #
#                     RECORDER                     #
#                                                  #
####################################################

recorder:
  commit_interval: 300  #seconds
  purge_keep_days: 7
  auto_purge: true
  include:
    domains:
      - sensor
      - switch
      - light
      - climate



####################################################
#                                                  #
#                     MQTT                         #
#                                                  #
####################################################


tts:
  - platform: google_translate

group: !include groups.yaml
automation: !include automations.yaml
sensor: !include sensors.yaml

mobile_app:
ios:
shopping_list:
wake_on_lan:

frontend:



climate: !include climate.yaml

####################################################
#                                                  #
#                     TEMPLATE                     #
#                                                  #
####################################################

template:
  - sensor:
      - name: "Spina 1 Costo Oggi"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.spina1_energy_today') | float * 0.25) | round(2) }}

      - name: "Spina 2 Costo Oggi"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.spina2_energy_today') | float * 0.25) | round(2) }}

      - name: "Spina1 Firmware Clean"
        unique_id: spina1_firmware_clean
        state: >
          {{ states('sensor.spina1_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "Spina2 Firmware Clean"
        unique_id: spina2_firmware_clean
        state: >
          {{ states('sensor.spina2_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "LuceCucina Firmware Clean"
        unique_id: luce_cucina_firmware_clean
        state: >
          {{ states('sensor.luce_cucina_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "LuceCameraAlessio Firmware Clean"
        unique_id: luce_camera_alessio_firmware_clean
        state: >
          {{ states('sensor.luce_camera_alessio_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "LuceCorridoio Firmware Clean"
        unique_id: luce_corridoio_firmware_clean
        state: >
          {{ states('sensor.luce_corridoio_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "LuceSoggiorno1 Firmware Clean"
        unique_id: lucesoggiorno1_firmware_clean
        state: >
          {{ states('sensor.lucesoggiorno1_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "LuceSoggiorno2 Firmware Clean"
        unique_id: lucesoggiorno2_firmware_clean
        state: >
          {{ states('sensor.lucesoggiorno2_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "Riscaldamento Firmware Clean"
        unique_id: riscaldamento_firmware_clean
        state: >
          {{ states('sensor.riscaldamento_firmware_version') | replace('(release-tasmota)', '') | trim }}

      - name: "Tapparella Camera Alessio Firmware Clean"
        unique_id: tapparella_camera_alessio_firmware_clean
        state: >
          {{ states('sensor.tapparella_camera_alessio_firmware_version') | replace('(release-tasmota)', '') | trim }}

utility_meter: !include utility_meter.yaml
command_line: !include command_line.yaml
rest: !include rest.yaml

