- id: '1778532977753'
  alias: Riavvio deCONZ se tutti i sensori sono offline
  description: ''
  triggers:
  - entity_id:
    - sensor.camera_da_letto_temperatura
    - sensor.bagno_piccolo_temperatura
    - sensor.corridoio_temperatura
    - sensor.cucina_temperatura
    - sensor.esterno_parco_temperatura
    trigger: state
  conditions:
  - condition: template
    value_template: "{{\n  is_state('sensor.camera_da_letto_temperatura', 'unavailable')
      and\n  is_state('sensor.bagno_piccolo_temperatura', 'unavailable') and\n  is_state('sensor.corridoio_temperatura',
      'unavailable') and\n  is_state('sensor.cucina_temperatura', 'unavailable') and\n
      \ is_state('sensor.esterno_parco_temperatura', 'unavailable')\n}}\n"
  actions:
  - data:
      level: warning
      message: Tutti i sensori temperatura sono offline. Riavvio deCONZ.
    action: system_log.write
  - data:
      addon: core_deconz
    action: hassio.addon_restart
  mode: single
