- id: '1764278680422'
  alias: Notifica - Riscaldamento attivo
  description: Invia una Live Activity quando il riscaldamento passa da OFF a HEAT
  triggers:
  - trigger: state
    entity_id:
    - climate.riscaldamento
    from: 'off'
    to: heat
  actions:
  - action: notify.mobile_app_iphone_di_alessio
    data:
      title: "\U0001F525 Riscaldamento attivo"
      message: "\U0001F321 {{ state_attr('climate.riscaldamento', 'current_temperature')
        }} °C"
      data:
        tag: riscaldamento
        live_update: true
        notification_icon: mdi:fire
        url: https://casacarusio.duckdns.org:20000/lovelace/temperature?more-info-entity-id=climate.riscaldamento&more-info-view=info
        actions:
        - action: SPEGNI_RISCALDAMENTO
          title: ❌ Spegni
          destructive: true
  mode: single
