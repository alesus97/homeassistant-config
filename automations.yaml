- id: '1764278680422'
  alias: Notifica - Riscaldamento attivo (silenziosa e completa)
  description: Invia una notifica quando il riscaldamento passa da OFF a HEATING
  triggers:
  - entity_id: climate.riscaldamento
    from: 'off'
    to: heating
    trigger: state
  actions:
  - data:
      title: "\U0001F525 Riscaldamento attivato"
      message: "Il riscaldamento è in funzione. \U0001F321 Temperatura interna: {{
        state_attr('climate.riscaldamento','current_temperature') }}°C\n"
      data:
        push:
          sound: none
        persistent: true
        actions:
        - action: SPEGNI_RISCALDAMENTO
          title: ❌ Spegni
          destructive: true
    action: notify.mobile_app_iphone_di_alessio
  mode: single
- id: '1764280119505'
  alias: Pulsante Notifica - Spegni Riscaldamento
  description: ''
  triggers:
  - event_type: mobile_app_notification_action
    event_data:
      action: SPEGNI_RISCALDAMENTO
    trigger: event
  actions:
  - target:
      entity_id: climate.riscaldamento
    action: climate.turn_off
  mode: single
